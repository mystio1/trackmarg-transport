# Render Blueprint — see https://render.com/docs/blueprint-spec
#
# No managed Postgres resource here: the database is Supabase, not Render's own Postgres addon
# (see prisma/schema.prisma's datasource comment), so DATABASE_URL/DIRECT_URL are plain secrets
# set by hand in the Render dashboard (`sync: false` below) rather than auto-wired from a
# render.yaml-provisioned database.
#
# autoDeploy is deliberately false — the only thing allowed to trigger a deploy is
# .github/workflows/ci.yml's `deploy` job, which only runs after lint/build/test all pass. A
# broken build can reach Render's dashboard (as a manual-deploy option) but never production.
services:
  - type: web
    name: shivam-transport
    runtime: node
    plan: starter
    autoDeploy: false
    # --include=dev is REQUIRED because NODE_ENV=production (set below) makes npm omit
    # devDependencies by default — and vite, typescript, @vitejs/plugin-react-swc and prisma
    # all live there while being needed at build time. Without it the build dies with
    # "Cannot find module 'vite'" and a cascade of missing-type errors from vite/client.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npm run build:backend
    # Deliberately does NOT run `prisma migrate deploy` here. Supabase's Supavisor pooler doesn't
    # support the session-level advisory lock Prisma's migration engine needs, so `migrate deploy`
    # (like `migrate dev`/`migrate status` before it) hangs indefinitely rather than erroring —
    # this took down every earlier deploy attempt with "no open ports detected", since the server
    # itself never got a chance to start and bind a port. Migrations are instead generated offline
    # (`prisma migrate diff --from-empty --to-schema ... --script`) and applied by hand against
    # DIRECT_URL — see prisma/migrations/ — so by the time a new migration ships, it's already
    # applied to the database before this ever redeploys.
    startCommand: node backend/dist/index.js
    # Bare GET /health (backend/src/routes/health.routes.ts's rootHealthRouter) — mounted before
    # every other middleware in app.ts, so it's the fastest, most dependency-free path available.
    # Unrelated to /api/health, which the frontend's useKeepAlive hook still pings separately.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # SendGrid's HTTPS API, not SMTP — Render blocks outbound SMTP (ports 465/587) entirely on
      # the free tier, which made the old Gmail-SMTP mailer hang indefinitely on every request
      # that tried to send. See backend/src/services/mailer.ts.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      # Master password for the cross-tenant /support console (see backend/src/routes/support.routes.ts).
      # Leaving this unset in the Render dashboard disables the feature entirely.
      - key: SUPPORT_ACCESS_PASSWORD
        sync: false
